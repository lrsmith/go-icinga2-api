/* Templates used by the integration tests. */

template Host "go-icinga2-api-test-linux" {
  import "generic-host"

  vars.os = "Linux"
}

template Service "go-icinga2-api-test-service" {
  import "generic-service"

  vars.service_owner = "team"
}

template CheckCommand "go-icinga2-api-test-command" {
  import "plugin-check-command"

  arguments = {
    "-H" = "$host.address$"
  }
}

template Notification "go-icinga2-api-test-notification" {
  import "mail-host-notification"

  interval = 900
}
